##############################################################################
# Milo v1.5 — LinuxCNC + Remora
#
# Host:  Raspberry Pi 5 at 192.168.1.42 (hostname "milo", user "cnc")
#        Booting from SD. The NVMe is fitted but holds another project's
#        exfat partition — do not assume it is available.
#        LinuxCNC 2.9.8 / Debian 13 Trixie / 6.12.34+rpt-rpi-v8-rt
# Board: BTT Octopus v1.1 (STM32F4) running Remora firmware
#
# EVERY motion number below is derived from the machine's own RepRapFirmware
# config (Nextcloud/MiloCNC/RRF CDYV3 Files/sys/), NOT guessed. The RRF source
# line is quoted beside each one so it can be re-checked.
#
# Pin assignments now live in octopus/config.txt and are RESOLVED for the
# steppers, the TMC drivers and the three endstops. Still open: the spindle
# PWM + enable relay and the probe/toolsetter, because nothing is wired to
# them yet. See README-config.md.
##############################################################################

[EMC]
MACHINE = Milo-v1.5
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 1mm 5mm 10mm 20mm 50mm
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
# 20 mm/s default jog; ceiling is the X/Y machine limit (see [TRAJ])
DEFAULT_LINEAR_VELOCITY = 20.0
MIN_LINEAR_VELOCITY = 0.0
MAX_LINEAR_VELOCITY = 66.667
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 10mm 1mm 0.1mm 0.01mm 0.001mm
EDITOR = vim

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
# No base thread: Remora generates steps on the STM32, not on the Pi.
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = milo.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 20.0
# X/Y ceiling: M203 X4000 Y4000 (mm/min) -> 66.667 mm/s
MAX_LINEAR_VELOCITY = 66.667
DEFAULT_LINEAR_ACCELERATION = 300.0
MAX_LINEAR_ACCELERATION = 300.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

##############################################################################
# AXES
##############################################################################

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 335.0
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 300.0

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 208.0
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 300.0

[AXIS_Z]
MIN_LIMIT = -120.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 33.333
MAX_ACCELERATION = 200.0

##############################################################################
# JOINTS
#
# SCALE = steps per mm. Values below assume 8 MICROSTEPS. Remora's stepgen runs
# in a 40 kHz base thread and needs two cycles per pulse, so the hard ceiling is
# 20 kHz — see README-config.md. Required step rate at full rapid:
#    8 usteps: X/Y = 200   Z = 400   -> 13.3 kHz   OK          <- values used here
#   16 usteps: X/Y = 400   Z = 800   -> 26.7 kHz   over ceiling
#   32 usteps: X/Y = 800   Z = 1600  -> 53.3 kHz   far over    <- RRF's M92
# Mechanicals behind those: 200 full steps/rev, 8 mm/rev on X/Y, 4 mm/rev on Z.
#
# ⚠️ SCALE SIGN: RRF has all three motors direction-reversed (M569 P0/P1/P2 S0),
#    but that is relative to CDYv3 wiring and says nothing about the Octopus.
#    If an axis runs the wrong way, negate SCALE here — do not rewire.
##############################################################################

[JOINT_0]
# X — homes toward MIN (RRF: M574 X1, homex.g drives negative)
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = 0.0
MAX_LIMIT = 335.0
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 300.0
# stepgen gets ~25% headroom over the trajectory planner
STEPGEN_MAXACCEL = 375.0
SCALE = 200.0
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
# homeall.g: fast approach F1800 (30 mm/s), back off 5 mm, re-approach F180 (3 mm/s)
HOME_SEARCH_VEL = -30.0
HOME_LATCH_VEL = -3.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# Z lifts first, then X and Y home together (homeall.g calls homez.g first)
HOME_SEQUENCE = 1

[JOINT_1]
# Y — homes toward MAX (RRF: M574 Y2, homey.g drives positive)
TYPE = LINEAR
HOME = 208.0
MIN_LIMIT = 0.0
MAX_LIMIT = 208.0
MAX_VELOCITY = 66.667
MAX_ACCELERATION = 300.0
STEPGEN_MAXACCEL = 375.0
SCALE = 200.0
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 208.0
HOME_SEARCH_VEL = 30.0
HOME_LATCH_VEL = 3.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

[JOINT_2]
# Z — homes toward MAX = 0 (RRF: M574 Z2; homez.g ends "G92 Z{max}")
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -120.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 33.333
MAX_ACCELERATION = 200.0
STEPGEN_MAXACCEL = 250.0
SCALE = 400.0
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 30.0
HOME_LATCH_VEL = 3.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# Sequence 0 = Z homes FIRST, lifting the tool clear before X/Y move.
HOME_SEQUENCE = 0

##############################################################################
# SPINDLE — RRF: M950 R0 C"PE_6+!PB_9" L24000 Q100
#   L24000 = 24000 RPM at full scale
#   Q100   = 100 Hz PWM
#   !PB_9  = inverted enable/direction
##############################################################################

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 24000
MIN_FORWARD_VELOCITY = 0
MAX_REVERSE_VELOCITY = 0
