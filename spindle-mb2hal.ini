# mb2hal — Huanyang H100 spindle VFD over Modbus RTU
#
# Every address and unit below was VERIFIED ON THE HARDWARE (2026-09-06), not
# taken from the manual alone. See VFD-H100.md.
#
#   38400 8N1, slave 1        (F164=3, F165=3 — F165=3 is 8N1, NOT 8E1)
#   0201H (513) write  speed setpoint, units 0.1 Hz
#   0049H (73)  coil   forward run — this coil ALONE starts it; 0048H not needed
#   0220H (544) read   actual output frequency, units 0.1 Hz
#
# 🚨 NEVER add a transaction that WRITES an F parameter (registers 0-255).
#    Those live in EEPROM and the manual warns they cannot be rewritten
#    frequently without damaging it. Only 0200H and above are RAM. Reading them
#    is fine; a polled write would destroy the drive.
#
# 🚨 PORT NAME — do NOT use /dev/serial/by-id/...
#    mb2hal CANNOT open it. That path is 49 chars and mb2hal uses fixed-size
#    buffers, so it fails with "cannot connect to link, ret[-1] fd[-1]".
#    mbpoll opens the identical path fine — that is what isolated the fault to
#    mb2hal rather than to permissions, the adapter or the port.
#    /dev/ttyUSB0 is not safe either: the number shifts with whatever else is
#    plugged in, and a USB card reader has already been on this Pi.
#    ⇒ Use the short stable symlink from 99-milo-vfd.rules (install it to
#      /etc/udev/rules.d/ or this will not start).

[MB2HAL_INIT]
VERSION=1.1
HAL_MODULE_NAME=mb2hal
INIT_DEBUG=1
TOTAL_TRANSACTIONS=3

# --- write commanded speed -------------------------------------------------
# Value is RPM/6 (400.0 Hz = 4000 = 24000 RPM). spindle.hal does the scaling.
[TRANSACTION_00]
LINK_TYPE=serial
SERIAL_PORT=/dev/milo-vfd
SERIAL_BAUD=38400
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=1
SERIAL_DELAY_MS=20
MB_SLAVE_ID=1
MB_TX_CODE=fnct_06_write_single_register
FIRST_ELEMENT=513
NELEMENTS=1
HAL_TX_NAME=spindle-speed
MB_RESPONSE_TIMEOUT_MS=500
MB_BYTE_TIMEOUT_MS=500
MAX_UPDATE_RATE=10.0

# --- write run/stop --------------------------------------------------------
# Coil 0049H (Forward). Confirmed sufficient on its own; 0048H not required.
[TRANSACTION_01]
MB_SLAVE_ID=1
MB_TX_CODE=fnct_05_write_single_coil
FIRST_ELEMENT=73
NELEMENTS=1
HAL_TX_NAME=spindle-run
MAX_UPDATE_RATE=10.0

# --- read actual output frequency -----------------------------------------
# This is what makes spindle.0.at-speed real feedback rather than a timer.
[TRANSACTION_02]
MB_SLAVE_ID=1
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=544
NELEMENTS=1
HAL_TX_NAME=spindle-fb
MAX_UPDATE_RATE=10.0
